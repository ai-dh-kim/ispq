# Cloudflare Speed Test 일별 수집 (하루 1회). speed.cloudflare.com 사용자 실측의 ASN별 집계를
# 하루 창 summary 호출로 스냅샷 → public/speedtest_cache.json. 10분 크론(collect.yml)은 이 캐시만 읽는다.
name: Collect Cloudflare Speed Test (daily)

on:
  schedule:
    - cron: '23 5 * * *' # 매일 05:23 UTC (전일분 확정 후)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '오늘 기준 며칠 전까지 백필할지 (기본 5, 최초 실행 시 90 권장)'
        required: false
        default: '5'

concurrency:
  group: collect-speedtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch Cloudflare Speed Test daily snapshots → speedtest_cache.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '5' }}
        run: node scripts/collect-speedtest.ts

      - name: Commit cache
        run: |
          git config user.name "quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          git add public/speedtest_cache.json
          if git diff --cached --quiet; then
            echo "No speedtest cache changes."
          else
            git commit -m "chore(data): Cloudflare speedtest daily cache [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
