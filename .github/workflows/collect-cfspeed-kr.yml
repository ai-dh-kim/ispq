# 국내 3사 Cloudflare Speed Test "그날 하루" 값 수집 (주 1회) — 2026-11-11 도입.
# Radar API는 Speed Test를 직전 90일 누적으로만 줘서, 국내 3사는 M-Lab BigQuery의 측정 원자료로 하루치를 계산한다.
# 비용: 이 원자료 뷰는 조회 기간과 무관하게 매번 테이블 전체(2026-11 약 144GB)를 읽는다 → 주 1회만 실행하고,
#       한 번에 전체 이력을 다시 계산해 캐시를 통째로 교체한다. 과금 상한(CFSPEED_MAX_GB)을 넘으면 BigQuery가 거부 → 빨간불.
# 일정: 일요일 14:07 UTC 명목(크론 지연 감안 실제 ~16~19 UTC) → 같은 날 밤 주간 알림 메일(~23 UTC) 전에 반영.
#       토요일(UTC)까지의 하루치가 들어간다.
name: Collect Speed Test daily (KR, weekly)

on:
  schedule:
    - cron: '7 14 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '조회문 문법만 확인(과금 없음, 캐시 미변경). 조회문을 고친 뒤 실제 실행(약 144GB) 전에 사용'
        type: boolean
        default: false

concurrency:
  group: collect-cfspeed-kr
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # 수집 후 Refresh(collect.yml) 즉시 트리거용

jobs:
  cfspeed-kr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Query Speed Test raw data (BigQuery) → cfspeed_daily_cache.json
        env:
          MLAB_BQ_KEY: ${{ secrets.MLAB_BQ_KEY }}       # M-Lab 수집과 같은 서비스계정
          MLAB_BQ_PROJECT: ${{ secrets.MLAB_BQ_PROJECT }}
          CFSPEED_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/collect-cfspeed-kr.ts

      - name: Commit cache
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          git add public/cfspeed_daily_cache.json
          if git diff --cached --quiet; then
            echo "No Speed Test daily cache changes."
          else
            git commit -m "chore(data): Speed Test KR daily cache [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Trigger data refresh (그래프 즉시 반영)
        if: github.event.inputs.dry_run != 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "refresh dispatch HTTP $code"
          [ "$code" = "204" ] || echo "::warning::Refresh 트리거 실패(HTTP $code) — 다음 크론 주기에 자동 반영됨"
