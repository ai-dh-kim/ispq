# Cloudflare Radar IQI 일별 스냅샷 (하루 1회). Radar가 최근 ~90일까지만 제공하므로
# 매일 최근 며칠치를 iqi_cache.json에 누적해 장기(약 2년) 이력을 자체 보존한다.
name: Collect Cloudflare IQI snapshots (daily)

on:
  schedule:
    - cron: '47 5 * * *' # 매일 05:47 UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '며칠 전까지 받아올지 (기본 7, 최초 시드 시 90 — API 이력 한계)'
        required: false
        default: '7'

concurrency:
  group: collect-iqi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  iqi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch IQI daily snapshots → iqi_cache.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '7' }}
        run: node scripts/collect-iqi.ts

      - name: Commit cache
        run: |
          git config user.name "quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          git add public/iqi_cache.json
          if git diff --cached --quiet; then
            echo "No IQI cache changes."
          else
            git commit -m "chore(data): IQI daily snapshot cache [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
