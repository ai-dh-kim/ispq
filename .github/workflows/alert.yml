# 품질 이상 자동 알림 — 일 1회 트리거 판정 (2026-09-09, 핸드오프 §17).
# scripts/detect-anomaly.ts 가 quality_data.json + 캐시 generatedAt 만 읽어 A1~A6·D1·D2 를 판정하고
# public/alerts.json(활성 알림 + 이력)을 커밋한다. 판정 보고서는 매 실행 Step Summary 에 남는다
# (= 드라이런 뷰어: 메일을 켜지 않아도 "울렸다면 이런 메일이 갔을 것"을 Actions 탭에서 볼 수 있다).
#
# 메일 발송은 저장소 변수 ALERT_MAIL_ENABLED=true 일 때만, 그리고 (신규 이벤트가 있거나 주간 요약 크론)일 때만.
# 수동 실행의 test_mail=true 는 그와 무관하게 1통 강제 발송(배관 확인). 2026-09-09 드라이런 생략하고 바로 활성화.
# 필요한 시크릿: ALERT_SMTP_HOST · ALERT_SMTP_PORT · ALERT_SMTP_USER · ALERT_SMTP_PASS · ALERT_MAIL_TO · ALERT_MAIL_FROM
name: Quality alert triggers (daily)

on:
  schedule:
    # 12:00 KST 명목(03:00 UTC). 이 저장소의 크론 실측 지연(+2.5~4h)을 감안하면 실제 ~15:00 KST —
    # 일별 수집 7종(~06~12 KST)과 NIA→Refresh 체인이 모두 끝난 뒤다.
    - cron: '0 3 * * *'
    # 주간 요약: 월요일 09:00 KST 목표. 명목 06:15 KST(일 21:15 UTC)로 걸어 이 저장소의 크론 지연(+2.5~4h 실측)을
    # 흡수한다 → 실제 ~08:45~10:15 KST. 며칠 관찰 후 어긋나면 이 시각만 조정. 판정 자체는 일별과 동일하게 수행하고
    # 요약 부분만 '지난주 월~일' 창으로 계산(ALERT_WEEKLY).
    - cron: '15 21 * * 0'
  workflow_dispatch:
    inputs:
      test_mail:
        description: '테스트 메일 1통 강제 발송 (스위치·이벤트 유무 무관) — SMTP 배관 확인용'
        type: boolean
        default: false
      weekly:
        description: '주간 요약 형식으로 실행 (지난주 월~일 기준 순위·이벤트)'
        type: boolean
        default: false

concurrency:
  group: quality-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 주간 추이 차트(SVG→PNG)에 @resvg/resvg-js 가 필요(다른 수집기는 의존성 0이라 npm ci 가 없었음).
      - run: npm ci --no-audit --no-fund

      - name: Evaluate triggers → alerts.json + report (+ 주간이면 추이 차트 PNG)
        id: detect
        env:
          ALERT_REPORT: ${{ runner.temp }}/alert_report.md        # Step Summary용 markdown
          ALERT_REPORT_HTML: ${{ runner.temp }}/alert_report.html # 메일 본문용 HTML(판정기가 직접 생성 — 마크다운 변환기는 표를 못 그림)
          ALERT_TEST_MAIL: ${{ inputs.test_mail == true }}
          ALERT_WEEKLY: ${{ github.event.schedule == '15 21 * * 0' || inputs.weekly == true }}
        run: node scripts/detect-anomaly.ts

      - name: Publish report to step summary
        run: cat "${{ runner.temp }}/alert_report.md" >> "$GITHUB_STEP_SUMMARY"

      # 커밋 방식은 collect.yml 과 동일(최신 원격으로 reset 후 생성물을 얹음 — 리베이스 경합 없음, §15).
      # 이 워크플로만 쓰는 파일(alerts.json + 주간 차트 PNG)만 대피·복원한다. 커밋 SHA를 출력해 메일의 이미지 URL에 고정.
      - name: Commit alerts.json (+ weekly charts)
        id: commit
        run: |
          set -euo pipefail
          git config user.name "quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          cp public/alerts.json "${RUNNER_TEMP}/alerts.json"
          rm -rf "${RUNNER_TEMP}/alert_charts"
          if [ -d public/alert_charts ]; then cp -r public/alert_charts "${RUNNER_TEMP}/alert_charts"; fi
          for attempt in 1 2 3; do
            git fetch --no-tags origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            cp "${RUNNER_TEMP}/alerts.json" public/alerts.json
            git add public/alerts.json
            if [ -d "${RUNNER_TEMP}/alert_charts" ]; then
              mkdir -p public/alert_charts && cp "${RUNNER_TEMP}"/alert_charts/*.png public/alert_charts/ && git add public/alert_charts
            fi
            if git diff --cached --quiet; then echo "No alert state changes."; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
            git commit -m "chore(alert): trigger evaluation${ALERT_WEEKLY_FLAG:+ + weekly charts} [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed on attempt ${attempt}"; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::notice::push raced on attempt ${attempt} — 재시도"
          done
          echo "::error::3회 재시도 후에도 push 실패"; exit 1
        env:
          ALERT_WEEKLY_FLAG: ${{ (github.event.schedule == '15 21 * * 0' || inputs.weekly == true) && '1' || '' }}

      # 메일의 <img src> 자리표시자를 방금 커밋의 SHA 고정 raw URL로 치환(옛 메일도 이미지가 영구히 남는다).
      - name: Resolve chart URLs
        run: |
          HTML="${{ runner.temp }}/alert_report.html"
          sed -i "s#__CHART_BASE__#https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ steps.commit.outputs.sha }}/public/alert_charts#g" "$HTML"
          if grep -q __CHART_BASE__ "$HTML"; then echo "::error::차트 URL 자리표시자 치환 실패"; exit 1; fi
          echo "chart base: $(grep -o 'https://raw.githubusercontent.com[^"]*alert_charts' "$HTML" | head -1 || echo '(주간 아님 — 차트 없음)')"

      # inputs.test_mail 은 boolean 타입이라 문자열 'true'와 비교하면 안 됨(GitHub 식은 타입이 다르면 숫자로 강제변환 → false).
      - name: Send mail (사건/해소 즉시 · 주간 요약은 월요일 아침 크론 · test_mail 이면 무조건)
        if: ${{ (vars.ALERT_MAIL_ENABLED == 'true' && (steps.detect.outputs.new_events != '0' || steps.detect.outputs.weekly == 'true')) || inputs.test_mail == true }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.ALERT_SMTP_HOST }}
          server_port: ${{ secrets.ALERT_SMTP_PORT }}
          secure: true
          username: ${{ secrets.ALERT_SMTP_USER }}
          password: ${{ secrets.ALERT_SMTP_PASS }}
          subject: ${{ inputs.test_mail == true && '[ISPQ 테스트] 알림 메일 배관 확인 — 본문은 오늘 판정 보고서' || steps.detect.outputs.subject }}
          to: ${{ secrets.ALERT_MAIL_TO }}
          from: ${{ secrets.ALERT_MAIL_FROM }}
          html_body: file://${{ runner.temp }}/alert_report.html
