# [임시] NIA 통계 갱신 시각 프로브 — 2026-07-18부터 약 48~72시간만 운영.
# 매시간 사업자별 값을 받아 nia-probe 브랜치의 probe/nia_probe.jsonl 에 누적(main 오염 없음).
# 스크립트가 72시간 후 자동 수집 중단. 분석 완료 후 이 파일 + scripts/probe-nia.ts + nia-probe 브랜치 삭제.
name: "[임시] Probe NIA update time"

on:
  schedule:
    - cron: '7 * * * *' # 매시간(크론 지연으로 간격이 들쭉날쭉해도 각 기록에 타임스탬프가 있어 무방)
  workflow_dispatch: {}

concurrency:
  group: probe-nia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Probe and append to nia-probe branch
        run: |
          git config user.name "quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          # 데이터 브랜치로 전환(없으면 main에서 생성). 스크립트는 main에서 가져온 체크아웃에 이미 존재.
          git fetch origin nia-probe:refs/remotes/origin/nia-probe || true
          git checkout -B nia-probe origin/nia-probe 2>/dev/null || git checkout -b nia-probe
          # 프로브 스크립트/CA는 브랜치 생성 시점 것을 사용(브랜치에 이미 포함됨)
          node scripts/probe-nia.ts
          if git status --porcelain probe/ | grep -q .; then
            git add probe/
            git commit -m "probe: NIA hourly sample [skip ci]"
            git push origin nia-probe
          else
            echo "변경 없음(자동 종료 상태이거나 append 실패)."
          fi
