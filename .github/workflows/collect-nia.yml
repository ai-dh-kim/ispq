# NIA 인터넷 품질측정 사업자별 통계 수집 (하루 1회). 공개 통계 페이지의 데이터 피드라 인증/시크릿 불필요.
# 상품 4종(100M/500M/1G/10G) × 다운/업의 사업자별 평균(월간 집계 현재값)을 일별 스냅샷으로
# public/nia_cache.json 에 누적(최근 800일). 비공식 피드라 형식 변경 시 워크플로가 빨갛게 떠서 바로 감지.
name: Collect NIA speed stats (daily)

on:
  schedule:
    # 매일 00:17 UTC = 09:17 KST(오전 수집, 2026-07-16 사용자 요청으로 오후→오전 변경).
    # UTC 자정 직후라 스냅샷 날짜 키(UTC)와 KST 달력 날짜가 일치. GitHub 크론은 1~2시간
    # 지연이 일상이라 실제 실행은 오전 9~11시(KST) 범위로 예상.
    - cron: '17 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: collect-nia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch NIA per-ISP speed stats → nia_cache.json
        run: node scripts/collect-nia.ts

      - name: Commit cache
        run: |
          git config user.name "quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          git add public/nia_cache.json
          if git diff --cached --quiet; then
            echo "No NIA cache changes."
          else
            git commit -m "chore(data): NIA daily cache [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # 신선도 알람: 최근 3일 스냅샷이 전 사업자·전 값 완전 동일이면 수집기가 nia_stale.txt를 남긴다.
      # 커밋(위 단계)까지 마친 뒤 여기서 실패 처리 → 워크플로 빨간불 = GitHub 실패 알림(알람).
      - name: Staleness alarm (3일 연속 동일값)
        run: |
          if [ -f nia_stale.txt ]; then
            echo "::error::NIA 통계가 3일 이상 완전 동일 — 원본 갱신 중단 의심: $(cat nia_stale.txt)"
            exit 1
          fi
          echo "신선도 정상(최근 3일 내 값 변동 있음 또는 이력 3일 미만)."
