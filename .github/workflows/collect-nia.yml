# NIA 인터넷 품질측정 사업자별 통계 수집 (하루 1회). 공개 통계 페이지의 데이터 피드라 인증/시크릿 불필요.
# 상품 4종(100M/500M/1G/10G) × 다운/업의 사업자별 평균(월간 집계 현재값)을 일별 스냅샷으로
# public/nia_cache.json 에 누적(최근 800일). 비공식 피드라 형식 변경 시 워크플로가 빨갛게 떠서 바로 감지.
name: Collect NIA speed stats (daily)

on:
  schedule:
    # 오전(KST) 수집 — 실측상 GitHub 크론이 이 저장소에서 상시 +2.5~4시간 지연됨
    # (00:17→드롭, 01:23→04:17 실행, 02:53→05:12 실행). 지연을 상수로 보고 앞당긴다(2026-07-18):
    #   21:43 UTC(전날) = 06:43 KST → 실제 실행 ~09:40 KST
    #   23:13 UTC(전날) = 08:13 KST → 백업, 실제 실행 ~11:10 KST
    # 날짜 키는 collect-nia.ts가 KST 달력 날짜로 찍으므로 전날 UTC에 돌아도 "오늘"로 기록된다.
    - cron: '43 21 * * *'
    - cron: '13 23 * * *'
  workflow_dispatch: {}

concurrency:
  group: collect-nia
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # 수집 후 Refresh(collect.yml) 즉시 트리거용

jobs:
  nia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch NIA per-ISP speed stats → nia_cache.json
        run: node scripts/collect-nia.ts

      - name: Commit cache
        run: |
          git config user.name "quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          git add public/nia_cache.json
          if git diff --cached --quiet; then
            echo "No NIA cache changes."
          else
            git commit -m "chore(data): NIA daily cache [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # 수집 직후 quality_data.json 재조립을 즉시 트리거 — 다음 Refresh 크론(실측 1~3시간 간격)을
      # 기다리며 그래프 반영이 밀리는 레이스 제거(2026-07-18). GITHUB_TOKEN의 workflow_dispatch는
      # 재귀 방지 예외라 정상 트리거된다.
      - name: Trigger data refresh (그래프 즉시 반영)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "refresh dispatch HTTP $code"
          [ "$code" = "204" ] || echo "::warning::Refresh 트리거 실패(HTTP $code) — 다음 크론 주기에 자동 반영됨"

      # 신선도 알람: 최근 3일 스냅샷이 전 사업자·전 값 완전 동일이면 수집기가 nia_stale.txt를 남긴다.
      # 커밋(위 단계)까지 마친 뒤 여기서 실패 처리 → 워크플로 빨간불 = GitHub 실패 알림(알람).
      - name: Staleness alarm (3일 연속 동일값)
        run: |
          if [ -f nia_stale.txt ]; then
            echo "::error::NIA 통계가 3일 이상 완전 동일 — 원본 갱신 중단 의심: $(cat nia_stale.txt)"
            exit 1
          fi
          echo "신선도 정상(최근 3일 내 값 변동 있음 또는 이력 3일 미만)."
